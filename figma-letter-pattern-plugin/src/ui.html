<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Letter Pattern Generator</title>
  <style>
    :root {
      --bg: var(--figma-color-bg);
      --text: var(--figma-color-text);
      --border: var(--figma-color-border);
      --accent: var(--figma-color-bg-brand);
      --accent-text: var(--figma-color-text-onbrand);
      --muted: var(--figma-color-text-secondary);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font: 11px/1.4 Inter, system-ui, sans-serif;
      color: var(--text);
      background: var(--bg);
      padding: 12px;
    }
    h1 { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab {
      flex: 1; padding: 6px 8px; border: 1px solid var(--border);
      background: transparent; color: var(--text); border-radius: 6px;
      cursor: pointer; font-size: 11px;
    }
    .tab.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
    .panel { display: none; }
    .panel.active { display: block; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 3px; }
    .field input, .field select {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 4px; background: var(--bg); color: var(--text); font-size: 11px;
    }
    .row { display: flex; gap: 8px; }
    .row .field { flex: 1; }
    .actions { margin-top: 14px; display: flex; gap: 8px; }
    button.primary {
      flex: 1; padding: 8px; border: none; border-radius: 6px;
      background: var(--accent); color: var(--accent-text);
      font-size: 12px; font-weight: 600; cursor: pointer;
    }
    button.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    #status {
      margin-top: 10px; font-size: 10px; color: var(--muted); min-height: 28px;
    }
    #status.error { color: #e03e3e; }
    #status.warning { color: #c27c00; }
    #status.success { color: #1a7f37; }
    .preset-row { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>Letter Pattern Generator</h1>

  <div class="preset-row field">
    <label for="preset">Preset</label>
    <select id="preset">
      <option value="">Custom</option>
      <option value="originCafe">Origin Café</option>
      <option value="ginoriWeave">Ginori Weave</option>
      <option value="portfolioDark">Portfolio Dark</option>
    </select>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="scatter">Scatter</button>
    <button class="tab" data-tab="weave">Weave</button>
  </div>

  <div class="shared">
    <div class="field">
      <label for="name">Pattern name</label>
      <input id="name" type="text" value="My Pattern" />
    </div>
    <div class="row">
      <div class="field">
        <label for="width">Width</label>
        <input id="width" type="number" value="1440" min="100" />
      </div>
      <div class="field">
        <label for="height">Height</label>
        <input id="height" type="number" value="900" min="100" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="bgColor">Background</label>
        <input id="bgColor" type="text" value="#F29696" />
      </div>
      <div class="field">
        <label for="textColor">Text color</label>
        <input id="textColor" type="text" value="#3B1E30" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="fontFamily">Font family</label>
        <select id="fontFamily"></select>
      </div>
      <div class="field">
        <label for="fontStyle">Font style</label>
        <select id="fontStyle"></select>
      </div>
    </div>
  </div>

  <div id="scatter-panel" class="panel active">
    <div class="field">
      <label for="primaryText">Primary letters</label>
      <input id="primaryText" type="text" value="ORIGIN" />
    </div>
    <div class="field">
      <label for="insetText">Inset text (inside O, D, Q…)</label>
      <input id="insetText" type="text" value="CAFÉ" />
    </div>
    <div class="row">
      <div class="field">
        <label for="primaryFontSize">Primary size</label>
        <input id="primaryFontSize" type="number" value="180" min="12" />
      </div>
      <div class="field">
        <label for="insetRatio">Inset ratio</label>
        <input id="insetRatio" type="number" value="0.14" min="0.05" max="0.4" step="0.01" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="density">Density</label>
        <input id="density" type="number" value="0.55" min="0.2" max="1" step="0.05" />
      </div>
      <div class="field">
        <label for="overlap">Overlap</label>
        <input id="overlap" type="number" value="0.35" min="0" max="0.8" step="0.05" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="rotMin">Rotation min °</label>
        <input id="rotMin" type="number" value="-60" />
      </div>
      <div class="field">
        <label for="rotMax">Rotation max °</label>
        <input id="rotMax" type="number" value="-30" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="rotJitter">Rotation jitter °</label>
        <input id="rotJitter" type="number" value="8" min="0" />
      </div>
      <div class="field">
        <label for="seed">Seed</label>
        <input id="seed" type="number" value="42" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="insetFontFamily">Inset font family</label>
        <select id="insetFontFamily"></select>
      </div>
      <div class="field">
        <label for="insetFontStyle">Inset font style</label>
        <select id="insetFontStyle"></select>
      </div>
    </div>
  </div>

  <div id="weave-panel" class="panel">
    <div class="field">
      <label for="stringA">String A</label>
      <input id="stringA" type="text" value="GINORI 1735" />
    </div>
    <div class="field">
      <label for="stringB">String B</label>
      <input id="stringB" type="text" value="DOMUS 1735" />
    </div>
    <div class="row">
      <div class="field">
        <label for="weaveFontSize">Font size</label>
        <input id="weaveFontSize" type="number" value="48" min="8" />
      </div>
      <div class="field">
        <label for="rowGap">Row gap</label>
        <input id="rowGap" type="number" value="-8" />
      </div>
    </div>
    <div class="row">
      <div class="field">
        <label for="rowOffset">Row offset</label>
        <input id="rowOffset" type="number" value="120" min="0" />
      </div>
      <div class="field">
        <label for="letterSpacing">Letter spacing</label>
        <input id="letterSpacing" type="number" value="24" min="0" />
      </div>
    </div>
    <div class="field">
      <label>
        <input id="flipRows" type="checkbox" checked />
        Flip rows (4-row mirror cycle)
      </label>
    </div>
  </div>

  <div class="actions">
    <button id="generate" class="primary">Generate pattern</button>
  </div>
  <div id="status">Loading fonts…</div>

  <!-- SCRIPT -->
</body>
</html>
